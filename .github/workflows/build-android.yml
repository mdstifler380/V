name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Complete Native Vibration Android App
        run: |
          mkdir -p VibeLabApp/app/src/main/java/com/vibelab/vibrationmeter
          mkdir -p VibeLabApp/app/src/main/res/layout
          mkdir -p VibeLabApp/app/src/main/res/values

          # settings.gradle
          cat << 'EOF' > VibeLabApp/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VibeLab Pro"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > VibeLabApp/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # gradle.properties
          cat << 'EOF' > VibeLabApp/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # app/build.gradle
          cat << 'EOF' > VibeLabApp/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.vibelab.vibrationmeter'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vibelab.vibrationmeter"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > VibeLabApp/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS" />
              <application
                  android:allowBackup="true"
                  android:label="VibeLab Pro"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # strings.xml
          cat << 'EOF' > VibeLabApp/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">VibeLab Pro</string>
          </resources>
          EOF

          # activity_main.xml layout
          cat << 'EOF' > VibeLabApp/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#090D16"
              android:fillViewport="true">
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="22dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="VibeLab Pro"
                      android:textColor="#22D3EE"
                      android:textSize="26sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Continuous Vibration Power &amp; Motor Actuator Tester"
                      android:textColor="#94A3B8"
                      android:textSize="12sp"
                      android:layout_marginBottom="20dp" />

                  <TextView
                      android:id="@+id/tvStatus"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="■ MOTOR OFF (STANDBY)"
                      android:textColor="#94A3B8"
                      android:textSize="14sp"
                      android:textStyle="bold"
                      android:gravity="center"
                      android:padding="12dp"
                      android:background="#151D2F" />

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="#0F172A"
                      android:padding="16dp"
                      android:layout_marginTop="16dp">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="LIVE ACCELERATION (POWER METER)"
                          android:textColor="#94A3B8"
                          android:textSize="11sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/tvLivePower"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="0.00 m/s²"
                          android:textColor="#FFFFFF"
                          android:textSize="40sp"
                          android:textStyle="bold"
                          android:layout_marginTop="4dp" />

                      <TextView
                          android:id="@+id/tvPeakPower"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Peak: 0.00 G | Instant: 0.00 G"
                          android:textColor="#F59E0B"
                          android:textSize="13sp"
                          android:layout_marginTop="4dp" />
                  </LinearLayout>

                  <TextView
                      android:id="@+id/tvSliderLabel"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Vibration Power Level: 100% (Maximum Amplitude)"
                      android:textColor="#E2E8F0"
                      android:textSize="13sp"
                      android:layout_marginTop="20dp" />

                  <SeekBar
                      android:id="@+id/seekPower"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:max="255"
                      android:progress="255"
                      android:layout_marginTop="8dp" />

                  <Button
                      android:id="@+id/btnContinuousVibrate"
                      android:layout_width="match_parent"
                      android:layout_height="62dp"
                      android:text="▶ START NON-STOP CONTINUOUS VIBRATION"
                      android:backgroundTint="#06B6D4"
                      android:textColor="#090D16"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:layout_marginTop="22dp" />

                  <Button
                      android:id="@+id/btnPulseVibrate"
                      android:layout_width="match_parent"
                      android:layout_height="54dp"
                      android:text="💓 Pulsing / Heartbeat Rhythm Pattern"
                      android:backgroundTint="#1E293B"
                      android:textColor="#E2E8F0"
                      android:textSize="13sp"
                      android:layout_marginTop="10dp" />

                  <Button
                      android:id="@+id/btnStopVibrate"
                      android:layout_width="match_parent"
                      android:layout_height="54dp"
                      android:text="■ STOP VIBRATION MOTOR"
                      android:backgroundTint="#BE123C"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:layout_marginTop="10dp" />

              </LinearLayout>
          </ScrollView>
          EOF

          # MainActivity.java
          cat << 'EOF' > VibeLabApp/app/src/main/java/com/vibelab/vibrationmeter/MainActivity.java
          package com.vibelab.vibrationmeter;

          import android.content.Context;
          import android.graphics.Color;
          import android.hardware.Sensor;
          import android.hardware.SensorEvent;
          import android.hardware.SensorEventListener;
          import android.hardware.SensorManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.os.VibratorManager;
          import android.widget.Button;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity implements SensorEventListener {
              private Vibrator vibrator;
              private SensorManager sensorManager;
              private Sensor accelerometer;

              private TextView tvStatus, tvLivePower, tvPeakPower, tvSliderLabel;
              private SeekBar seekPower;
              private Button btnContinuousVibrate, btnPulseVibrate, btnStopVibrate;

              private Handler handler;
              private boolean isVibrating = false;
              private int vibrationAmplitude = 255;
              private float peakMag = 0f;

              private final Runnable continuousLoop = new Runnable() {
                  @Override
                  public void run() {
                      if (!isVibrating || vibrator == null) return;
                      fireHardwareVibrate(1200, vibrationAmplitude);
                      handler.postDelayed(this, 1000);
                  }
              };

              private final Runnable pulseLoop = new Runnable() {
                  @Override
                  public void run() {
                      if (!isVibrating || vibrator == null) return;
                      fireHardwareVibrate(300, vibrationAmplitude);
                      handler.postDelayed(this, 500);
                  }
              };

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  handler = new Handler(Looper.getMainLooper());

                  tvStatus = findViewById(R.id.tvStatus);
                  tvLivePower = findViewById(R.id.tvLivePower);
                  tvPeakPower = findViewById(R.id.tvPeakPower);
                  tvSliderLabel = findViewById(R.id.tvSliderLabel);
                  seekPower = findViewById(R.id.seekPower);
                  btnContinuousVibrate = findViewById(R.id.btnContinuousVibrate);
                  btnPulseVibrate = findViewById(R.id.btnPulseVibrate);
                  btnStopVibrate = findViewById(R.id.btnStopVibrate);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      VibratorManager vm = (VibratorManager) getSystemService(Context.VIBRATOR_MANAGER_SERVICE);
                      vibrator = vm.getDefaultVibrator();
                  } else {
                      vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                  }

                  sensorManager = (SensorManager) getSystemService(Context.SENSOR_SERVICE);
                  if (sensorManager != null) {
                      accelerometer = sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER);
                  }

                  seekPower.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          vibrationAmplitude = Math.max(10, progress);
                          int pct = (int) ((vibrationAmplitude / 255.0f) * 100);
                          tvSliderLabel.setText("Vibration Power Level: " + pct + "%");
                      }
                      @Override
                      public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override
                      public void onStopTrackingTouch(SeekBar seekBar) {}
                  });

                  btnContinuousVibrate.setOnClickListener(v -> startContinuous());
                  btnPulseVibrate.setOnClickListener(v -> startPulsing());
                  btnStopVibrate.setOnClickListener(v -> stopMotor());
              }

              private void startContinuous() {
                  stopMotor();
                  isVibrating = true;
                  tvStatus.setText("⚡ VIBRATING NON-STOP (CONTINUOUS)");
                  tvStatus.setTextColor(Color.parseColor("#22D3EE"));
                  handler.post(continuousLoop);
              }

              private void startPulsing() {
                  stopMotor();
                  isVibrating = true;
                  tvStatus.setText("💓 PULSING RHYTHM ACTIVE");
                  tvStatus.setTextColor(Color.parseColor("#F59E0B"));
                  handler.post(pulseLoop);
              }

              private void stopMotor() {
                  isVibrating = false;
                  handler.removeCallbacks(continuousLoop);
                  handler.removeCallbacks(pulseLoop);
                  if (vibrator != null) vibrator.cancel();
                  tvStatus.setText("■ MOTOR OFF (STANDBY)");
                  tvStatus.setTextColor(Color.parseColor("#94A3B8"));
              }

              private void fireHardwareVibrate(long durationMs, int amplitude) {
                  if (vibrator == null || !vibrator.hasVibrator()) return;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      int amp = (amplitude > 0 && amplitude <= 255) ? amplitude : VibrationEffect.DEFAULT_AMPLITUDE;
                      vibrator.vibrate(VibrationEffect.createOneShot(durationMs, amp));
                  } else {
                      vibrator.vibrate(durationMs);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (accelerometer != null) {
                      sensorManager.registerListener(this, accelerometer, SensorManager.SENSOR_DELAY_UI);
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  stopMotor();
                  if (sensorManager != null) sensorManager.unregisterListener(this);
              }

              @Override
              public void onSensorChanged(SensorEvent event) {
                  float x = event.values[0];
                  float y = event.values[1];
                  float z = event.values[2];
                  float mag = (float) Math.sqrt(x * x + y * y + z * z);
                  if (mag > peakMag) peakMag = mag;
                  float gForce = mag / 9.80665f;
                  float peakG = peakMag / 9.80665f;

                  tvLivePower.setText(String.format("%.2f m/s²", mag));
                  tvPeakPower.setText(String.format("Peak: %.2f G | Instant: %.2f G", peakG, gForce));
              }

              @Override
              public void onAccuracyChanged(Sensor sensor, int accuracy) {}
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build Debug APK
        working-directory: VibeLabApp
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeLab-Pro-APK
          path: VibeLabApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
