name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Android Project Root
        id: find_dir
        run: |
          BUILD_FILE=$(find . -name "build.gradle" -not -path "*/app/*" | head -n 1)
          if [ -n "$BUILD_FILE" ]; then
            PROJECT_DIR=$(dirname "$BUILD_FILE")
          else
            PROJECT_DIR="."
          fi
          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: ''

      - name: Set up Gradle Executable
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.find_dir.outputs.dir }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Collect APK
        run: |
          mkdir -p apk_output
          find . -name "*.apk" -exec cp {} apk_output/ \;
          ls -la apk_output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeLab-Pro-APK
          path: apk_output/*.apk
          if-no-files-found: error
          retention-days: 14
