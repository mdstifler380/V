name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Complete Native WebView Android App
        run: |
          mkdir -p VibeLabApp/app/src/main/java/com/vibelab/vibrationmeter
          mkdir -p VibeLabApp/app/src/main/assets
          mkdir -p VibeLabApp/app/src/main/res/layout
          mkdir -p VibeLabApp/app/src/main/res/values

          # 1. settings.gradle
          cat << 'EOF' > VibeLabApp/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VibeLab Pro"
          include ':app'
          EOF

          # 2. root build.gradle
          cat << 'EOF' > VibeLabApp/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > VibeLabApp/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > VibeLabApp/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.vibelab.vibrationmeter'
              compileSdk 34
              defaultConfig {
                  applicationId "com.vibelab.vibrationmeter"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # 5. Extract original full VibeLab Pro UI into Android assets
          echo "" | base64 -d > VibeLabApp/app/src/main/assets/vibration_power_analyzer.html

          # 6. AndroidManifest.xml with continuous vibration permission
          cat << 'EOF' > VibeLabApp/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS" />
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:label="VibeLab Pro"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. strings.xml
          cat << 'EOF' > VibeLabApp/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">VibeLab Pro</string>
          </resources>
          EOF

          # 8. activity_main.xml layout holding full-screen WebView
          cat << 'EOF' > VibeLabApp/app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#090D16">
              <WebView
                  android:id="@+id/webView"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent" />
          </FrameLayout>
          EOF

          # 9. MainActivity.java with direct Hardware Vibrator Bridge
          cat << 'EOF' > VibeLabApp/app/src/main/java/com/vibelab/vibrationmeter/MainActivity.java
          package com.vibelab.vibrationmeter;

          import android.annotation.SuppressLint;
          import android.content.Context;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.os.VibratorManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private Vibrator vibrator;
              private Handler handler;
              private boolean isContinuousVibrating = false;
              private Runnable continuousVibrationTask;

              public class AndroidHapticBridge {
                  @JavascriptInterface
                  public void startContinuous(int dutyPercent) {
                      isContinuousVibrating = true;
                      handler.post(continuousVibrationTask);
                  }

                  @JavascriptInterface
                  public void stopVibration() {
                      isContinuousVibrating = false;
                      if (vibrator != null) vibrator.cancel();
                  }

                  @JavascriptInterface
                  public void vibrateOnce(long durationMs, int amplitude) {
                      triggerNativeVibrate(durationMs, amplitude);
                  }
              }

              @SuppressLint({"SetJavaScriptEnabled", "JavascriptInterface"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  handler = new Handler(Looper.getMainLooper());

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      VibratorManager vm = (VibratorManager) getSystemService(Context.VIBRATOR_MANAGER_SERVICE);
                      vibrator = vm.getDefaultVibrator();
                  } else {
                      vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                  }

                  // Loop that guarantees non-stop continuous vibration
                  continuousVibrationTask = new Runnable() {
                      @Override
                      public void run() {
                          if (isContinuousVibrating && vibrator != null) {
                              triggerNativeVibrate(1500, 255);
                              handler.postDelayed(this, 1200);
                          }
                      }
                  };

                  webView = findViewById(R.id.webView);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setLoadWithOverviewMode(true);
                  settings.setUseWideViewPort(true);

                  // Connect JavaScript bridge to native Android motor
                  webView.addJavascriptInterface(new AndroidHapticBridge(), "AndroidBridge");
                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          // Connect UI buttons directly to Android motor
                          String bridgeScript = 
                              "if (window.AndroidBridge) {" +
                              "  const oldStart = window.startMotorTest;" +
                              "  window.startMotorTest = function() {" +
                              "    AndroidBridge.startContinuous(85);" +
                              "    if (oldStart) oldStart();" +
                              "  };" +
                              "  const oldStop = window.stopMotorTest;" +
                              "  window.stopMotorTest = function() {" +
                              "    AndroidBridge.stopVibration();" +
                              "    if (oldStop) oldStop();" +
                              "  };" +
                              "  const btnStart = document.getElementById('btnStartMotor');" +
                              "  if (btnStart) btnStart.addEventListener('click', () => AndroidBridge.startContinuous(85));" +
                              "  const btnStop = document.getElementById('btnStopMotor');" +
                              "  if (btnStop) btnStop.addEventListener('click', () => AndroidBridge.stopVibration());" +
                              "}";
                          view.evaluateJavascript(bridgeScript, null);
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("file:///android_asset/vibration_power_analyzer.html");
              }

              private void triggerNativeVibrate(long durationMs, int amplitude) {
                  if (vibrator == null || !vibrator.hasVibrator()) return;
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      int amp = (amplitude > 0 && amplitude <= 255) ? amplitude : VibrationEffect.DEFAULT_AMPLITUDE;
                      vibrator.vibrate(VibrationEffect.createOneShot(durationMs, amp));
                  } else {
                      vibrator.vibrate(durationMs);
                  }
              }

              @Override
              protected void onDestroy() {
                  super.onDestroy();
                  isContinuousVibrating = false;
                  if (vibrator != null) vibrator.cancel();
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build Debug APK
        working-directory: VibeLabApp
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeLab-Pro-APK
          path: VibeLabApp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
